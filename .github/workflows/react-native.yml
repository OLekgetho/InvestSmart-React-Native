name: Expo React Native Main Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Main APK
        run: eas build --platform android --profile main --non-interactive
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-main.apk
          path: $(eas build:inspect --latest | grep 'apk' | cut -d ' ' -f2)
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
